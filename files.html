<!DOCTYPE html>
<html lang="ja" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Files</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { dark: '#121212', light: '#f9fafb' } } } }
    </script>
    <style>
        .file-item { transition: all 0.2s ease; cursor: pointer; }
        .list-view .file-item { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem; border-bottom: 1px solid #e5e7eb; }
        .dark .list-view .file-item { border-bottom: 1px solid #374151; }
        .tile-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1rem; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; }
    </style>
</head>
<body class="h-full bg-light dark:bg-dark text-gray-900 dark:text-gray-100 transition-colors duration-500">
    
    <header class="sticky top-0 z-40 bg-light/95 dark:bg-dark/95 backdrop-blur-sm border-b border-gray-200 dark:border-gray-700 px-4 py-4">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-extrabold tracking-tight">Files</h1>
            <div class="flex gap-4 items-center">
                <button onclick="toggleView()" class="text-2xl" title="表示切り替え">▦</button>
                <button onclick="toggleTheme()" class="text-2xl" title="テーマ切り替え">🌓</button>
                <label class="text-2xl cursor-pointer" title="ファイルアップロード">
                    ➕<input type="file" id="fileInput" multiple class="hidden">
                </label>
            </div>
        </div>

        <div class="max-w-5xl mx-auto mt-4 flex flex-wrap gap-4 border-b border-gray-200 dark:border-gray-700 pb-2">
            <div id="tabs" class="flex gap-4 overflow-x-auto">
                <button onclick="setFilter('all')" class="tab-btn pb-1 font-semibold tab-active" data-filter="all">すべて</button>
                <button onclick="setFilter('image/')" class="tab-btn pb-1 font-semibold text-gray-500" data-filter="image/">画像</button>
                <button onclick="setFilter('video/')" class="tab-btn pb-1 font-semibold text-gray-500" data-filter="video/">動画</button>
                <button onclick="setFilter('audio/')" class="tab-btn pb-1 font-semibold text-gray-500" data-filter="audio/">音声</button>
                <button onclick="setFilter('application/pdf')" class="tab-btn pb-1 font-semibold text-gray-500" data-filter="application/pdf">PDF</button>
                <button onclick="setFilter('other')" class="tab-btn pb-1 font-semibold text-gray-500" data-filter="other">その他</button>
                <button onclick="setFilter('trash')" class="tab-btn pb-1 font-semibold text-gray-500" data-filter="trash">♻️</button>
            </div>
            <select id="sortSelect" onchange="render()" class="ml-auto text-sm bg-gray-100 dark:bg-gray-800 p-1 rounded border border-gray-300 dark:border-gray-600">
                <option value="date-desc">追加日 (新しい順)</option>
                <option value="date-asc">追加日 (古い順)</option>
                <option value="name-asc">名前 (A-Z)</option>
                <option value="name-desc">名前 (Z-A)</option>
                <option value="size">サイズ (大きい順)</option>
            </select>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4">
        <input type="text" id="searchInput" placeholder="検索..." oninput="render()" class="w-full mb-6 p-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-transparent outline-none transition">
        <div id="file-grid" class="tile-view"></div>
    </main>

    <div id="previewModal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50" onclick="closePreview()">
        <div class="bg-white dark:bg-gray-900 p-6 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] overflow-auto border border-gray-200 dark:border-gray-700" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h2 id="previewTitle" class="text-xl font-bold truncate">ファイルプレビュー</h2>
                <button onclick="closePreview()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-3xl">&times;</button>
            </div>
            <div id="previewContent" class="flex justify-center items-center min-h-[400px] bg-gray-50 dark:bg-black rounded-xl overflow-hidden"></div>
        </div>
    </div>

    <script>
        let db;
        let currentFilter = 'all';
        let isFetching = false;

        const request = indexedDB.open("FileSystemDB", 18);
        request.onupgradeneeded = e => {
            db = e.target.result;
            if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "id" });
        };
        request.onsuccess = e => { db = e.target.result; render(); };

        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('tab-active', btn.dataset.filter === filter);
                btn.classList.toggle('text-gray-500', btn.dataset.filter !== filter);
            });
            render();
        }

        async function render() {
            if (isFetching) return;
            isFetching = true;
            const grid = document.getElementById('file-grid');
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const sortMode = document.getElementById('sortSelect').value;
            
            const files = await new Promise((resolve) => {
                const list = [];
                const tx = db.transaction("files", "readonly");
                tx.objectStore("files").openCursor().onsuccess = e => {
                    const cursor = e.target.result;
                    if (cursor) {
                        list.push(cursor.value);
                        cursor.continue();
                    } else resolve(list);
                };
            });

            const filtered = files.filter(f => {
                const matchesSearch = f.name.toLowerCase().includes(searchTerm);
                const matchesFilter = (currentFilter === 'trash') ? !!f.isDeleted : 
                                     (!f.isDeleted && (currentFilter === 'all' || f.type.startsWith(currentFilter) || (currentFilter === 'other' && !f.type.startsWith('image/') && !f.type.startsWith('video/') && !f.type.startsWith('audio/') && !f.type.startsWith('application/pdf') && !f.type.startsWith('text/'))));
                return matchesSearch && matchesFilter;
            }).sort((a, b) => {
                if (sortMode === 'date-asc') return a.id - b.id;
                if (sortMode === 'date-desc') return b.id - a.id;
                if (sortMode === 'name-asc') return a.name.localeCompare(b.name);
                if (sortMode === 'name-desc') return b.name.localeCompare(a.name);
                if (sortMode === 'size') return b.data.length - a.data.length;
                return 0;
            });

            grid.innerHTML = '';
            filtered.forEach(f => {
                const div = document.createElement('div');
                div.className = 'file-item bg-white dark:bg-gray-800 p-4 rounded-xl shadow-sm border border-gray-200 dark:border-gray-700 hover:border-blue-400';
                div.innerHTML = `<div class="truncate font-semibold mb-3 text-sm" onclick="previewFile(${f.id})">📄 ${f.name}</div>
                    <div class="flex gap-2" onclick="event.stopPropagation()">
                        ${currentFilter === 'trash' ? 
                        `<button onclick="restoreFile(${f.id})" class="flex-1 bg-green-500 text-white rounded py-1 text-xs">復元</button>
                         <button onclick="permanentlyDelete(${f.id})" class="flex-1 bg-red-800 text-white rounded py-1 text-xs">消去</button>` : 
                        `<button onclick="moveToTrash(${f.id})" class="flex-1 bg-red-500 text-white rounded py-1 text-xs">🗑️</button>
                         <button onclick="downloadFile(${f.id})" class="flex-1 bg-blue-500 text-white rounded py-1 text-xs">⬇️</button>`}
                    </div>`;
                grid.appendChild(div);
            });
            isFetching = false;
        }

        document.getElementById('fileInput').onchange = e => {
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = () => {
                    const tx = db.transaction("files", "readwrite");
                    tx.objectStore("files").add({ id: Date.now() + Math.random(), name: file.name, type: file.type, data: reader.result, isDeleted: false });
                    tx.oncomplete = () => render();
                };
                reader.readAsDataURL(file);
            });
            e.target.value = '';
        };

        function moveToTrash(id) { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").get(id).onsuccess = e => { const f = e.target.result; f.isDeleted = true; tx.objectStore("files").put(f); }; tx.oncomplete = () => render(); }
        function restoreFile(id) { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").get(id).onsuccess = e => { const f = e.target.result; f.isDeleted = false; tx.objectStore("files").put(f); }; tx.oncomplete = () => render(); }
        function permanentlyDelete(id) { const tx = db.transaction("files", "readwrite"); tx.objectStore("files").delete(id); tx.oncomplete = () => render(); }
        function downloadFile(id) { db.transaction("files", "readonly").objectStore("files").get(id).onsuccess = e => { const a = document.createElement('a'); a.href = e.target.result.data; a.download = e.target.result.name; a.click(); }; }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        function toggleView() { const grid = document.getElementById('file-grid'); grid.classList.toggle('tile-view'); grid.classList.toggle('list-view'); }
        function previewFile(id) { db.transaction("files", "readonly").objectStore("files").get(id).onsuccess = e => { 
            const f = e.target.result; const content = document.getElementById('previewContent');
            if (f.type.startsWith('image/')) content.innerHTML = `<img src="${f.data}" class="max-w-full max-h-[70vh] rounded-lg">`;
            else if (f.type.startsWith('video/')) content.innerHTML = `<video src="${f.data}" controls class="max-w-full max-h-[70vh] rounded-lg"></video>`;
            else if (f.type.startsWith('audio/')) content.innerHTML = `<audio src="${f.data}" controls class="w-full"></audio>`;
            else if (f.type === 'application/pdf') content.innerHTML = `<iframe src="${f.data}" class="w-full h-[600px]"></iframe>`;
            else if (f.type.startsWith('text/')) { try { content.innerHTML = `<pre class="whitespace-pre-wrap p-5 w-full max-h-[70vh] overflow-auto text-xs font-mono">${atob(f.data.split(',')[1])}</pre>`; } catch(err) { content.innerHTML = "プレビュー不可"; } }
            else content.innerHTML = `<div class="p-10">プレビュー非対応</div>`;
            document.getElementById('previewTitle').textContent = f.name; document.getElementById('previewModal').classList.remove('hidden');
        }}
        function closePreview() { document.getElementById('previewModal').classList.add('hidden'); }
    </script>
</body>
</html>
